<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="theme-color" content="#F3F4F8">
<title>Finanzas Vicho</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#F3F4F8;--bg2:#FFFFFF;--bg3:#F2F4F7;--card:#FFFFFF;--border:#EAECF0;--text:#101828;--sec:#667085;--hint:#98A2B3;--ac:#0B1B3A;--ac-d:#0B1B3A;--ac-t:#F2F4F7;--navy:#0B1B3A;--green:#12B76A;--green-d:#067647;--red:#F04438;--red-d:#B42318;--amber:#F79009;--amber-d:#B54708;--sh:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05);--safe-t:env(safe-area-inset-top,20px);--safe-b:env(safe-area-inset-bottom,16px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;color:inherit;transition:transform .15s,background .2s,box-shadow .2s}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{max-width:440px;margin:0 auto;padding:calc(var(--safe-t) + 12px) 18px calc(28px + var(--safe-b))}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.who{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(150deg,#1A2B55,var(--navy));color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(11,27,58,.25)}
.hdr small{font-size:13px;color:var(--sec);display:block;margin-bottom:1px}
.hdr h1{font-size:21px;font-weight:700;letter-spacing:-.4px}
.refresh{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);box-shadow:var(--sh)}
.refresh:active{transform:rotate(-90deg) scale(.94)}
.hero{border-radius:28px;padding:22px 22px 20px;position:relative;overflow:hidden;color:#fff;background:linear-gradient(150deg,#1A2B55,var(--navy));box-shadow:0 12px 32px -12px rgba(11,27,58,.55);transition:background .4s,box-shadow .4s}
.hero.ok{background:linear-gradient(150deg,#17C47A,#07884E);box-shadow:0 14px 32px -12px rgba(7,136,78,.55)}
.hero.warn{background:linear-gradient(150deg,#FDA42B,#DC6803);box-shadow:0 14px 32px -12px rgba(220,104,3,.5)}
.hero.bad{background:linear-gradient(150deg,#F7655A,#C4271B);box-shadow:0 14px 32px -12px rgba(196,39,27,.5)}
.hero:before,.hero:after{content:'';position:absolute;border-radius:50%;pointer-events:none}
.hero:after{width:260px;height:260px;border:40px solid rgba(255,255,255,.07);top:-120px;right:-90px}
.hero:before{width:140px;height:140px;background:rgba(255,255,255,.06);bottom:-70px;left:-40px}
.h-lbl{font-size:14px;font-weight:500;color:rgba(255,255,255,.82);position:relative}
.h-amt{font-size:52px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:6px 0 10px;font-variant-numeric:tabular-nums;position:relative}
.h-l1{font-size:15px;font-weight:600;position:relative}
.h-l2{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:3px;position:relative}
.h-bar{height:6px;background:rgba(255,255,255,.2);border-radius:99px;margin:18px 0 16px;overflow:hidden;position:relative}
.h-bar div{height:100%;background:#fff;border-radius:99px;width:0;transition:width .6s}
.h-msg svg.i{width:18px;height:18px;margin-top:1px}
.h-msg{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:11px 13px;font-size:13px;line-height:1.45;position:relative;z-index:1;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.act{border:none;border-radius:20px;padding:14px;font-size:15px;white-space:nowrap;font-weight:600;display:flex;align-items:center;gap:10px;text-align:left;letter-spacing:-.2px}
.act i{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act.p{background:var(--ac);color:#fff;box-shadow:0 10px 24px -8px rgba(11,27,58,.5)}
.act.p i{background:rgba(255,255,255,.18)}
.act.s{background:var(--card);border:1px solid var(--border);box-shadow:var(--sh)}
.act.s i{background:var(--ac-t);color:var(--ac)}
.act:active{transform:scale(.97)}
.win{margin:-4px 0 14px;padding:10px 14px;border-radius:14px;text-align:center;font-size:13px;color:var(--green-d);font-weight:600;background:#ECFDF3}
.nudge{margin-bottom:10px;padding:12px 12px 12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--border);box-shadow:var(--sh);font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-left:4px solid var(--amber)}
.nudge button{border:none;background:var(--navy);color:#fff;font-weight:600;font-size:13px;padding:9px 14px;border-radius:99px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:6px 16px;margin-bottom:14px;box-shadow:var(--sh)}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:12px 0 4px}
.card-h h2{font-size:16px;font-weight:700;letter-spacing:-.3px}
.card-h button{border:none;background:var(--ac-t);color:var(--ac);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px}
.crow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left}
.crow:last-child{border-bottom:none}
.crow:active{opacity:.6}
.ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.cm{flex:1;min-width:0}
.cm b{font-size:14.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm small{font-size:12.5px;color:var(--sec)}
.ca{text-align:right;font-size:15px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--bg3);border-radius:99px;margin-top:8px;overflow:hidden}
.bar div{height:100%;border-radius:99px}
.fin{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-radius:24px;margin-bottom:14px;background:var(--card);border:1px solid var(--border);box-shadow:var(--sh);width:100%;text-align:left;position:relative;overflow:hidden}
.fin:before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--green)}
.fin span{font-size:12.5px;color:var(--sec)}
.fin span b{display:block;color:var(--text);font-size:14.5px;font-weight:600;margin-bottom:2px}
.fin > b{font-size:22px;font-weight:700;color:var(--green-d);white-space:nowrap;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.fin:active,.next:active,.meta:active{transform:scale(.98)}
.chev{flex-shrink:0;width:8px;height:8px;border-top:2px solid var(--hint);border-right:2px solid var(--hint);transform:rotate(45deg);font-size:0;margin-right:4px}
.next{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:24px;margin-bottom:14px;background:var(--card);border:1px solid var(--border);box-shadow:var(--sh);width:100%;text-align:left}
.next i{font-style:normal;font-size:20px;width:42px;height:42px;border-radius:14px;background:#FFFAEB;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.next b{font-size:14.5px;font-weight:600;display:block}
.next small{font-size:12.5px;color:var(--sec)}
.next .cm b{white-space:normal}
.big-g{font-size:34px;font-weight:700;letter-spacing:-1px;color:var(--green-d);margin:2px 0 4px;font-variant-numeric:tabular-nums}
.step{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.step:last-child{border-bottom:none}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--ac-t);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.step .n.ok{background:var(--green);color:#fff}
.step b{font-size:14px;font-weight:600;display:block;margin-bottom:3px}
.step small{font-size:12.5px;color:var(--sec);line-height:1.5;display:block}
.fine{font-size:11px!important;color:var(--hint)!important;line-height:1.5}
.meta{padding:18px;border-radius:24px;margin-bottom:14px;background:linear-gradient(150deg,#1A2B55,var(--navy));color:#fff;border:none;width:100%;text-align:left;box-shadow:0 12px 28px -14px rgba(11,27,58,.6);position:relative;overflow:hidden}
.meta:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;border:30px solid rgba(255,255,255,.05);top:-80px;right:-60px;pointer-events:none}
.meta .t{font-size:12px;font-weight:600;color:#FEC84B;letter-spacing:.02em}
.meta .v{font-size:24px;font-weight:700;margin:6px 0 4px;letter-spacing:-.5px}
.meta .v span{color:rgba(255,255,255,.55)!important}
.meta small{font-size:12.5px;color:rgba(255,255,255,.7);line-height:1.5}
.meta small b{color:#fff!important}
.meta .bar{background:rgba(255,255,255,.12);margin-top:12px}
.meta .bar div{background:linear-gradient(90deg,#FDB022,#FEC84B)}
.mt{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;font-size:12.5px;padding:10px 0;border-bottom:1px solid var(--border);align-items:center}
.mt:last-child{border-bottom:none}
.mt b{font-size:13px}
.mt.h{color:var(--hint);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.lever{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.5;color:var(--sec)}
.lever:last-child{border-bottom:none}
.lever b{color:var(--text);font-weight:600}
.cal{display:block;text-align:center;text-decoration:none;padding:16px;border-radius:16px;font-size:16px;font-weight:600;margin-top:14px;background:var(--ac);color:#fff;box-shadow:0 10px 24px -8px rgba(11,27,58,.5)}
.sheet-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:100;display:none;align-items:flex-end;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:440px;margin:0 auto;background:var(--bg2);border-radius:28px 28px 0 0;padding:10px 20px calc(20px + var(--safe-b));max-height:90vh;overflow-y:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.handle{width:40px;height:5px;background:#D0D5DD;border-radius:99px;margin:0 auto 16px}
.sheet h3{font-size:21px;font-weight:700;letter-spacing:-.4px;margin-bottom:4px}
.sheet p{font-size:13.5px;color:var(--sec);margin-bottom:14px;line-height:1.5}
.sheet label{font-size:13px;color:var(--text);font-weight:600;display:block;margin:16px 0 8px}
.sheet input,.sheet select{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--border);background:var(--bg3);color:var(--text);font-size:16px;-webkit-appearance:none;outline:none;transition:border-color .2s,background .2s}
.sheet input:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 4px rgba(11,27,58,.08)}
.amt-in{font-size:40px!important;font-weight:700;text-align:center;letter-spacing:-1px;padding:18px 14px!important;background:transparent!important;border:none!important;border-bottom:2px solid var(--border)!important;border-radius:0!important;box-shadow:none!important;font-variant-numeric:tabular-nums}
.amt-in::placeholder{color:#D0D5DD}
.amt-in:focus{border-bottom-color:var(--ac)!important}
.sheet .card,.sheet .box{background:#F9FAFB;box-shadow:none}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sugs button,.chip{padding:9px 14px;border-radius:99px;border:1px solid var(--border);background:#fff;font-size:13.5px;font-weight:500}
.sugs button:active,.chip:active{transform:scale(.95)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.btn{width:100%;padding:16px;border-radius:16px;border:none;font-size:16px;font-weight:600;margin-top:16px}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--ac);color:#fff;box-shadow:0 10px 24px -8px rgba(11,27,58,.5)}
.btn.p[style*="bg3"]{box-shadow:none}
.btn.g{background:var(--green);color:#fff;margin-top:8px;box-shadow:0 10px 24px -10px rgba(18,183,106,.6)}
.btn.d{background:#FEF3F2;color:var(--red-d);margin-top:8px}
.verdict{margin-top:16px;padding:14px 16px;border-radius:18px;font-size:14px;line-height:1.5;display:none;border:1px solid transparent}
.verdict.on{display:block}
.verdict b{font-size:16px;font-weight:700;display:block;margin-bottom:4px}
.verdict.ok{background:#ECFDF3;border-color:#ABEFC6}
.verdict.ok b{color:var(--green-d)}
.verdict.warn{background:#FFFAEB;border-color:#FEDF89}
.verdict.warn b{color:var(--amber-d)}
.verdict.bad{background:#FEF3F2;border-color:#FECDCA}
.verdict.bad b{color:var(--red-d)}
.verdict.neg{background:#F4F3FF;border-color:#D9D6FE}
.verdict.neg b{color:#5925DC}
.box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:4px 16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:13.5px;gap:10px}
.row:last-child{border-bottom:none}
.row span{color:var(--sec)}
.row b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding:16px 2px 8px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.chart span{width:100%;border-radius:6px 6px 3px 3px;background:#D0D5DD;min-height:3px}
.chart span.b{background:var(--green)}
.chart small{font-size:10px;color:var(--hint);font-weight:500}
.tip{display:flex;gap:12px;background:#F9FAFB;border:1px solid var(--border);border-radius:16px;padding:13px 14px;font-size:13.5px;line-height:1.5;color:var(--sec);margin-bottom:8px}
.tip i{font-style:normal;font-size:18px}
.tip b{color:var(--text);font-weight:600}
.empty{text-align:center;color:var(--hint);font-size:13.5px;padding:22px}
.toast{position:fixed;bottom:calc(30px + var(--safe-b));left:50%;transform:translate(-50%,10px);background:var(--navy);color:#fff;padding:13px 20px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;transition:.25s;z-index:200;white-space:nowrap;pointer-events:none;box-shadow:0 12px 30px -8px rgba(11,27,58,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.skel{height:220px;border-radius:28px;background:linear-gradient(90deg,#E4E7EC,#F2F4F7,#E4E7EC);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="who"><div class="avatar">V</div><div><small id="greet">Hola</small><h1 id="mes-t">Vicho</h1></div></div>
    <button class="refresh" onclick="loadAll()" aria-label="Actualizar"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg></button>
  </div>
  <div id="viendo"></div>
  <div id="hero-w"><div class="skel"></div></div>
  <div class="actions">
    <button class="act p" onclick="openAdd()"><i><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i>Anotar gasto</button>
    <button class="act s" onclick="openCheck()"><i><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></i>¿Me alcanza?</button>
  </div>
  <div id="win"></div>
  <div id="nudges"></div>
  <div class="card">
    <div class="card-h"><h2>En qué se te va</h2><button onclick="openAll()">Ver todo</button></div>
    <div id="top3"></div>
  </div>
  <button class="fin" id="fin" onclick="openProy()"></button>
  <div id="next"></div>
  <button class="meta" id="meta" onclick="openMeta()" style="display:none"></button>
  <div class="card menu">
    <button class="crow" onclick="openMovs()"><div class="ic" style="background:#F2F4F7;color:#344054"><svg class="i" viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></div><div class="cm"><b>Todos los gastos</b><small id="m-movs">—</small></div><span class="chev">›</span></button>
    <button class="crow" onclick="openCuotas()"><div class="ic" style="background:#EFF8FF;color:#1570EF"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg></div><div class="cm"><b>Cuotas y fijos</b><small id="m-cuo">—</small></div><span class="chev">›</span></button>
    <button class="crow" onclick="openTips()"><div class="ic" style="background:#F4F3FF;color:#6938EF"><svg class="i" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/></svg></div><div class="cm"><b>Consejos del coach</b><small id="m-tips">—</small></div><span class="chev">›</span></button>
    <button class="crow" onclick="openPlata()"><div class="ic" style="background:#FFFAEB;color:#DC6803"><svg class="i" viewBox="0 0 24 24"><path d="M3 22h18M6 18v-7M10 18v-7M14 18v-7M18 18v-7M12 2l8 5H4z"/></svg></div><div class="cm"><b>Impuestos y dónde invertir</b><small id="m-plata">APV, devolución de impuestos y tu plan</small></div><span class="chev">›</span></button>
    <button class="crow" onclick="openAvisos()"><div class="ic" style="background:#FDF2FA;color:#DD2590"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div><div class="cm"><b>Avisos</b><small>Que el celular te recuerde qué hacer y cuándo</small></div><span class="chev">›</span></button>
    <button class="crow" onclick="openFin()"><div class="ic" style="background:#ECFDF3;color:#079455"><svg class="i" viewBox="0 0 24 24"><path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg></div><div class="cm"><b>Sueldos y patrimonio</b><small>Fintual, cartas, ETH y tus sueldos</small></div><span class="chev">›</span></button>
    <button class="crow" onclick="openMeses()"><div class="ic" style="background:#F2F4F7;color:#344054"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/></svg></div><div class="cm"><b>Meses anteriores</b><small>Compara cómo te fue</small></div><span class="chev">›</span></button>
    <button class="crow" onclick="editPpto()"><div class="ic" style="background:#F2F4F7;color:#344054"><svg class="i" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></div><div class="cm"><b>Presupuesto del mes</b><small id="m-ppto">—</small></div><span class="chev">›</span></button>
  </div>
</div>

<div class="sheet-bg" id="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const SB='https://caaewoxfvmdizzziyvfz.supabase.co';

 fijo:{n:'Suscripciones',ic:'🔁',c:'#2E90FA'}, transporte:{n:'Transporte',ic:'🚇',c:'#EAB308'},

const UTM=71649,APV_ANUAL=40*UTM,APV_MES=Math.round(APV_ANUAL/12),APV_BONO=6*UTM;
const TR=[[13.5,0],[30,.04],[50,.08],[70,.135],[90,.23],[120,.304],[310,.35],[1e9,.40]];
function impAnual(b){const u=b/(UTM*12);let t=0,prev=0;for(const[lim,r]of TR){const hi=Math.min(u,lim);if(hi>prev)t+=(hi-prev)*r;prev=lim;if(u<=lim)break}return t*UTM*12}

const setFlag=k=>{try{localStorage.setItem(k,'1')}catch(e){}};

const MESL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let S={periodo:null,actual:null,periodos:[],gastos:[],prev:[],cuotas:[],reglas:[],techos:{},pptos:{},ppto:1000000,card:'scotiabank',ing:{},V:{}};

const api=async(p,o={})=>{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),12000);try{const r=await fetch(SB+'/rest/v1/'+p,{headers:{...H,...(o.h||{})},method:o.m||'GET',body:o.b?JSON.stringify(o.b):undefined,signal:ctl.signal});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}finally{clearTimeout(to)}};

const fmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-CL');
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2400)};
const perL=p=>{const[y,m]=p.split('-');return MESL[+m-1]+' '+y};
const mdiff=(a,b)=>{const[ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return(by-ay)*12+(bm-am)};
const addM=(p,n)=>{let[y,m]=p.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+String(m).padStart(2,'0')};
function periodoDe(fecha,t){const d=new Date(fecha+'T12:00:00');if(d.getDate()>(CORTE[t]||31))d.setMonth(d.getMonth()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
const hoyISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function cuotasDe(per){return S.cuotas.map(c=>{if(c.recurrente)return{...c,label:'Todos los meses'};if(!c.primer_periodo)return null;const n=mdiff(c.primer_periodo,per)+1;if(n<1||n>c.total_cuotas)return null;return{...c,n,label:`Cuota ${n} de ${c.total_cuotas}`,restante:c.monto_cuota*(c.total_cuotas-n),fin:addM(c.primer_periodo,c.total_cuotas-1)}}).filter(Boolean)}
function guess(desc){const d=(desc||'').toLowerCase();const r=S.reglas.find(x=>d.includes(x.palabra.toLowerCase()));return r?{cat:r.categoria_clave,neg:r.negocio}:{cat:'otros',neg:false}}
const evKey=()=>'evitado-'+S.actual;
const getEv=()=>{try{return +localStorage.getItem(evKey())||0}catch(e){return 0}};
const addEv=x=>{try{localStorage.setItem(evKey(),getEv()+x)}catch(e){}};

$('greet').textContent=(h=>h<12?'Buenos días ☀️':h<20?'Buenas tardes 🌤':'Buenas noches 🌙')(new Date().getHours());

async function loadAll(){
  try{
    const [cats,pers,cuotas,pptos,reglas,aj]=await Promise.all([
      api('categorias?select=clave,techo'),api('gastos?select=periodo'),
      api('cuotas?activa=eq.true&order=monto_cuota.desc'),api('presupuestos?select=*'),
      api('reglas_categoria?select=palabra,categoria_clave,negocio'),api('ajustes?select=clave,valor')
    ]);
    S.aj={};(aj||[]).forEach(a=>S.aj[a.clave]=a.valor);
    cats.forEach(c=>S.techos[c.clave]=c.techo);
    S.cuotas=cuotas;S.pptos={};pptos.forEach(p=>S.pptos[p.periodo]=p.monto);
    S.reglas=reglas.sort((a,b)=>b.palabra.length-a.palabra.length);
    S.actual=periodoDe(hoyISO(),'scotiabank');
    S.periodos=[...new Set(pers.map(x=>x.periodo).filter(Boolean).concat(S.actual))].sort();
    if(!S.periodo)S.periodo=S.actual;
    await loadPeriodo();loadIngresos();
  }catch(e){console.error(e);$('hero-w').innerHTML='<div class="hero bad"><div class="h-lbl">Sin conexión</div><div class="h-l1" style="margin-top:8px">Toca ↻ arriba para reintentar</div></div>';}
}
function setPer(p){S.periodo=p;closeSheet();loadAll();window.scrollTo(0,0)}

async function loadPeriodo(){
  const pv=addM(S.periodo,-1);
  const all=await api(`gastos?periodo=in.(${S.periodo},${pv})&order=fecha.desc,id.desc`);
  S.gastos=all.filter(g=>g.periodo===S.periodo);S.prev=all.filter(g=>g.periodo===pv&&!g.pulldex);
  S.ppto=S.pptos[S.periodo]||1000000;render();
}

const SVG=d=>`<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
const HICO=(c,q)=>SVG(c==='ok'||(c===''&&q>=0)?'<circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/>':c==='bad'||c===''?'<path d="M7.9 2h8.2L22 7.9v8.2L16.1 22H7.9L2 16.1V7.9z"/><path d="M12 8v4M12 16h.01"/>':'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>');
function render(){
  const pers=S.gastos.filter(g=>!g.pulldex),neg=S.gastos.filter(g=>g.pulldex);
  const gast=pers.reduce((s,g)=>s+g.monto,0),CQ=cuotasDe(S.periodo),cuo=CQ.reduce((s,c)=>s+c.monto_cuota,0);
  const total=gast+cuo,queda=S.ppto-total,p=Math.min(100,Math.round(total/S.ppto*100));
  const[y,m]=S.periodo.split('-').map(Number);
  const cierre=new Date(y,m-1,22),hoy=new Date();hoy.setHours(0,0,0,0);
  const dias=Math.max(1,Math.round((cierre-hoy)/864e5)+1),esActual=S.periodo===S.actual;
  const tot={},items={},ptot={};
  pers.forEach(g=>{tot[g.categoria_clave]=(tot[g.categoria_clave]||0)+g.monto;(items[g.categoria_clave]=items[g.categoria_clave]||[]).push(g)});
  S.prev.forEach(g=>ptot[g.categoria_clave]=(ptot[g.categoria_clave]||0)+g.monto);
  const nt=neg.reduce((s,g)=>s+g.monto,0),mes=MESL[m-1],pvL=MESL[+addM(S.periodo,-1).slice(5)-1];
  const com=tot.comida||0,tc=S.techos.comida||250000,diario=queda/dias;
  const base=esActual?Math.max(total,S.ppto):total,libre=Math.max(0,SUELDO-base),fin=Math.round(libre/2);
  S.V={tot,items,ptot,nt,neg,mes,pvL,CQ,cuo,gast,total,queda,dias,esActual,diario,proy:{base,libre,fin,col:libre-fin,over:total>S.ppto}};

  $('mes-t').textContent=mes;
  $('viendo').innerHTML=esActual?'':`<div class="nudge"><div>👀 Estás viendo <b>${perL(S.periodo)}</b></div><button onclick="setPer(S.actual)">Volver a hoy</button></div>`;

  let cls,lbl,amt,l1,msg;
  if(!esActual){cls='';lbl=queda>=0?`Te sobró en ${mes}`:`Te pasaste en ${mes}`;amt=fmt(Math.abs(queda));l1=`Gastaste ${fmt(total)} de ${fmt(S.ppto)}`;msg=queda>=0?'<span>Mes cerrado en positivo.</span>':'<span>Mes cerrado en rojo. Que no se repita.</span>';}
  else if(queda<0){cls='bad';lbl='Te pasaste por';amt=fmt(-queda);l1='Hasta el 22 cada peso sale de tu ahorro';msg='<span>Freno total: solo súper y transporte hasta el 22.</span>';}
  else{
    lbl='Hoy puedes gastar';amt=fmt(diario);l1=`Te quedan ${fmt(queda)} hasta el 22`;
    if(com>tc*.8){cls='warn';msg=`<span>Comida va al ${Math.round(com/tc*100)}%. Cero delivery y restoranes hasta el 22.</span>`;}
    else if(diario<15000){cls='warn';msg='<span>Margen justo. Cocina en casa y posterga cualquier compra.</span>';}
    else{cls='ok';msg=`<span>Vas bien. Si te mantienes, fin de mes van <b>${fmt(fin)}</b> a Fintual.</span>`;}
  }
  $('hero-w').innerHTML=`<div class="hero ${cls}"><div class="h-lbl">${lbl}</div><div class="h-amt">${amt}</div><div class="h-l1">${l1}</div><div class="h-l2">Ya descontados ${fmt(cuo)} de cuotas y fijos</div><div class="h-bar"><div style="width:${p}%"></div></div><div class="h-msg">${HICO(cls,queda)}${msg}</div></div>`;

  const ev=getEv();$('win').innerHTML=esActual&&ev?`<div class="win">💪 Este mes te aguantaste ${fmt(ev)} en compras</div>`:'';

  let nz='';const rev=items.otros||[];
  if(rev.length)nz+=`<div class="nudge"><div>❓ <b>${rev.length} gasto${rev.length>1?'s':''} sin categoría</b></div><button onclick="openCat('otros')">Ordenar</button></div>`;
  if(esActual){const man=S.gastos.filter(g=>g.tarjeta==='scotiabank'||g.tarjeta==='efectivo').map(g=>g.fecha).sort().pop();const ds=man?Math.round((hoy-new Date(man+'T00:00:00'))/864e5):null;
    if(ds===null||ds>=2)nz+=`<div class="nudge"><div>✍️ ${ds===null?'No has anotado gastos de Scotia':`Llevas <b>${ds} días</b> sin anotar lo de Scotia`}</div><button onclick="openAdd()">Anotar</button></div>`;}
  $('nudges').innerHTML=nz;

  const tops=Object.entries(tot).filter(([k])=>k!=='otros').sort((a,b)=>b[1]-a[1]).slice(0,3);
  $('top3').innerHTML=tops.length?tops.map(([k])=>catRow(k)).join(''):'<div class="empty">Aún no hay gastos este mes 🎉</div>';

  $('fin').innerHTML=esActual?`<span><b>A Fintual a fin de ${mes}</b>${S.V.proy.over?'Te pasaste: ya bajó':'Asegurado si no te pasas'}</span><b>${fmt(fin)}</b>`:`<span><b>Quedaba para ahorrar</b>en ${mes}</span><b>${fmt(libre)}</b>`;
  $('m-movs').textContent=`${S.gastos.length} este mes${nt?' · incluye negocio':''}`;
  $('m-cuo').textContent=`${fmt(cuo)} al mes · se suman solas`;
  $('m-tips').textContent=`${tipsList().length} consejos para ${mes}`;
  $('m-ppto').textContent=`${fmt(S.ppto)} (incluye cuotas)`;
  renderNext();renderMeta();
}

function nextMove(){
  const m=new Date().getMonth()+1,T=S.tax;
  if(T&&T.dev>50000&&m>=3&&m<=5)return['🧾',`Pide la reliquidación en la Operación Renta`,`Te podrían devolver ≈ ${fmt(Math.round(T.dev/10000)*10000)}`];
  if(!flag('apv-abierto'))return['🎯','Abre tu APV régimen A en Fintual',`Aportando ${fmt(APV_MES)} al mes, el Estado te pone hasta ${fmt(APV_BONO)} al año`];
  if(T&&T.dev>50000)return['🧾',`Abril ${+T.y+1}: pide la reliquidación`,`Te podrían devolver ≈ ${fmt(Math.round(T.dev/10000)*10000)} de impuestos`];
  return['💰','El día del sueldo: primero APV y Fintual','Después gastas lo que queda'];
}
function renderNext(){if(!S.V.esActual){$('next').innerHTML='';return}const[i,b,s]=nextMove();$('next').innerHTML=`<button class="next" onclick="openPlata()"><i>${i}</i><div class="cm"><b>Tu próximo movimiento</b><small>${b} · ${s}</small></div><span class="chev">›</span></button>`;
  if(S.tax)$('m-plata').textContent=`Devolución estimada ${fmt(Math.round(S.tax.dev/10000)*10000)} · APV ${flag('apv-abierto')?'✓':'pendiente'}`}

  <div class="card"><div class="card-h"><h2>Tu plan, en orden</h2></div>
    <div class="step"><div class="n ${apv?'ok':''}">${apv?'✓':'1'}</div><div><b>🎯 APV régimen A: ${fmt(APV_MES)} al mes</b><small>El Estado te pone 15% encima, hasta ${fmt(APV_BONO)} al año. Con tu sueldo normal pagas 4% de impuesto, así que el régimen A (15%) te conviene más que el B. Se abre en Fintual → “Mi primera jubilación”. Ojo: es para la pensión; si lo sacas antes, devuelves el bono.</small>${apv?'':`<button class="chip on" style="margin-top:8px" onclick="setFlag('apv-abierto');openPlata();render()">Ya lo abrí ✓</button>`}</div></div>
    <div class="step"><div class="n ${2700000>=3000000?'ok':''}">2</div><div><b>🛟 Colchón: 3 meses de gastos (~$3.000.000)</b><small>Plata para emergencias, a la mano y sin riesgo. Tus $2,7M en Moderate Pitt casi lo cubren: completa ~$300k con el colchón de este mes y no lo toques.</small></div></div>
    <div class="step"><div class="n">3</div><div><b>📈 Largo plazo: todo lo demás a Risky Norris</b><small>Lo que no va al APV ni al colchón, a tu fondo agresivo en Fintual. Plata que no vas a tocar en años. Ya ganaste +26,7% ahí.</small></div></div>
    <div class="step"><div class="n">4</div><div><b>🃏 Cartas y ETH: no sumar más por ahora</b><small>Ya son el ${alt}% de todo lo que tienes. Es harto en cosas que suben y bajan fuerte. Mientras no baje de ~20%, la plata nueva va a Fintual.</small></div></div>
    <div class="step"><div class="n">5</div><div><b>🏠 Si te independizas en menos de 2 años</b><small>Esa plata no va al fondo agresivo: va a uno conservador, para que una caída no te deje sin el pie para arrendar.</small></div></div>
  </div>
  <div class="card"><div class="card-h"><h2>¿Te llegó un bono?</h2></div><p style="margin:4px 0 8px">Pon cuánto te llegó líquido ese mes y te digo dónde va cada peso.</p>
    <input id="b-in" class="amt-in" inputmode="numeric" placeholder="$0" oninput="fmtIn(this);calcBono()"><div id="b-out" style="padding:6px 0 10px"></div></div>
  <p class="fine">No soy asesor financiero ni tributario: son reglas generales aplicadas a tus números, con la UTM de ${fmt(UTM)}. Para la renta, confírmalo en sii.cl (reliquidación art. 47) o con un contador.</p>`);
}
function calcBono(){
  const x=val('b-in'),o=$('b-out');if(!x){o.innerHTML='';return}
  if(x<=SUELDO){o.innerHTML=`<div class="row"><span>Es un mes normal: sigue el plan de siempre.</span></div>`;return}
  const extra=x-SUELDO,inv=Math.round(extra*.7),apv=Math.min(inv,APV_ANUAL),rv=inv-apv,libre=extra-inv;
  o.innerHTML=`<div class="row"><span>Sueldo normal (para el mes)</span><b>${fmt(SUELDO)}</b></div><div class="row"><span>Extra del bono</span><b>${fmt(extra)}</b></div>
  <div class="row"><span>→ APV régimen A</span><b style="color:var(--green-d)">${fmt(apv)}</b></div>${rv?`<div class="row"><span>→ Fintual largo plazo</span><b style="color:var(--green-d)">${fmt(rv)}</b></div>`:''}
  <div class="row"><span>→ Para ti, sin culpa (30%)</span><b>${fmt(libre)}</b></div>
  <small style="color:var(--sec);font-size:12px;display:block;padding-top:8px">El impuesto alto que te retengan ese mes lo recuperas en abril con la reliquidación.</small>`;
}

const PAT=()=>S.aj.patrimonio||{fintual:13047596,cartas:5000000,eth:1440000};
const PERF=()=>S.aj.perfil||{nacimiento:'1999-12-03',meta:100000000};
const RENT=.06;
const fmtM=n=>n>=1e9?'$'+(n/1e9).toLocaleString('es-CL',{maximumFractionDigits:2})+' mil M':'$'+(n/1e6).toLocaleString('es-CL',{maximumFractionDigits:n<1e8?1:0})+'M';
function edadAhora(){const b=new Date(PERF().nacimiento+'T12:00:00'),n=new Date();return (n-b)/(365.25*864e5)}
function mesesHasta(P,A,T){let m=0;while(P<T&&m<1200){P=P*(1+RENT/12)+A;m++}return m}
function aportes(){
  const base=Math.max(0,Math.round(Math.max(0,SUELDO-S.ppto)/2))+Math.round(APV_MES*.15);
  const ks=Object.keys(S.ing||{}).sort().slice(-12);
  const bonos=ks.reduce((s,k)=>s+Math.max(0,S.ing[k]-SUELDO),0)*.7/12/2;
  return{base,conBonos:Math.round(base+bonos)};
}
function proyMeta(T,A){const p=PAT(),inv=p.fintual+p.eth,m=mesesHasta(inv,A,Math.max(0,T-p.cartas));const e=edadAhora()+m/12,y=new Date().getFullYear()+Math.floor((new Date().getMonth()+m)/12);return{m,e,y}}
function renderMeta(){
  const el=$('meta');if(!S.V.esActual||!S.ing||!Object.keys(S.ing).length){el.style.display='none';return}
  const p=PAT(),tot=p.fintual+p.eth+p.cartas,meta=PERF().meta,{base,conBonos}=aportes(),r=proyMeta(meta,base),r2=proyMeta(meta,conBonos);
  el.style.display='block';
  el.innerHTML=`<div class="t">🏆 Camino a tus primeros ${fmtM(meta)}</div><div class="v">${fmtM(tot)} <span style="font-size:14px;color:var(--sec);font-weight:600">de ${fmtM(meta)}</span></div><small>Siguiendo el plan llegas a los <b style="color:var(--text)">${Math.floor(r.e)} años</b> (${r.y}). Con la mitad de tus bonos, a los <b style="color:var(--text)">${Math.floor(r2.e)}</b>.</small><div class="bar"><div style="width:${Math.min(100,tot/meta*100)}%"></div></div>`;
}
function openMeta(){
  const p=PAT(),tot=p.fintual+p.eth+p.cartas,{base,conBonos}=aportes(),metas=[[50e6,'$50M'],[100e6,'$100M'],[250e6,'$250M'],[950e6,'USD 1 millón*']];
  const d10=x=>x*Math.pow(1+RENT,10);
  const ahorroCom=200000,rC=proyMeta(PERF().meta,base+ahorroCom),rB=proyMeta(PERF().meta,base);
  openSheet(`<h3>🏆 Camino a millonario</h3><p>Hoy tienes <b style="color:var(--text)">${fmtM(tot)}</b> (Fintual ${fmtM(p.fintual)}, cartas ${fmtM(p.cartas)}, ETH ${fmtM(p.eth)}). Tienes ${Math.floor(edadAhora())} años.</p>
  <div class="card"><div class="card-h"><h2>¿Cuándo llegas?</h2></div>
   <div class="mt h"><span>Meta</span><span>Solo el plan<br>${fmt(base)}/mes</span><span>+ mitad bonos<br>${fmt(conBonos)}/mes</span></div>
   ${metas.map(([T,l])=>{const a=proyMeta(T,base),b=proyMeta(T,conBonos);return`<div class="mt"><b>${l}</b><span>${Math.floor(a.e)} años · ${a.y}</span><span style="color:var(--green-d)">${Math.floor(b.e)} años · ${b.y}</span></div>`}).join('')}

function evalCheck(){
  const V=S.V,x=val('a-monto'),desc=$('a-desc').value,{cat,neg}=guess(desc),el=$('verdict');
  if(!x){el.className='verdict';$('chk-btns').style.display='none';return}
  $('chk-btns').style.display='block';
  const t=S.techos[cat]||0,s=V.tot[cat]||0,catN=cat!=='otros'?CAT[cat].n:null;
  const q2=V.queda-x,d2=q2/V.dias,fin2=Math.round(Math.max(0,SUELDO-Math.max(V.total+x,S.ppto))/2);
  let c,h,b;
  if(neg){c='neg';h='🧩 Es para el negocio';b=`No toca tu presupuesto personal, pero son ${fmt(x)} que tienen que volver con ventas.`}
  else if(cat==='coleccionables'&&!t){c='bad';h='🚫 No. Cartas bloqueadas este mes';b=`Este mes los coleccionables personales tienen tope $0. Si es para PULLDEX, escribe "pulldex" en la descripción.`}
  else if(q2<0){c='bad';h='🔴 No te alcanza';b=`Te pasarías del mes por ${fmt(-q2)} y eso sale de tu ahorro: a Fintual irían ${fmt(fin2)} en vez de ${fmt(V.proy.fin)}.`}
  else if(x<=Math.max(0,V.diario)){c='ok';h='✅ Sí, te alcanza';b=`Después de esto, hoy te quedarían ${fmt(V.diario-x)}. Fintual sigue intacto.`}
  else if(catN&&t&&s+x>t){c='warn';h=`⚠️ Te alcanza, pero te pasas en ${catN}`;b=`Quedarías ${fmt(s+x-t)} sobre el tope de ${catN}. Tu gasto diario bajaría a ${fmt(d2)} hasta el 22.`}
  else{c='warn';h='⚠️ Te alcanza, pero te aprieta';b=`Es más de lo que te toca hoy. Los próximos ${V.dias} días bajarías a ${fmt(d2)} al día.`}
  if(!neg)b+=`<br><span style="color:var(--sec);font-size:13px">💡 Invertidos, esos ${fmt(x)} serían ${fmt(x*Math.pow(1.06,10))} en 10 años.</span>`;
  el.className='verdict on '+c;el.innerHTML=`<b>${h}</b>${b}`;
}

    if(cat!=='otros'&&palabra.length>2&&!S.reglas.some(r=>r.palabra.toLowerCase()===palabra))await api('reglas_categoria',{m:'POST',b:{palabra,categoria_clave:cat,negocio:neg}});
    closeSheet();toast('✅ Listo, lo recordaré');loadAll();
  }catch(e){toast('❌ Error');console.error(e)}
}
async function delTx(id){if(!confirm('¿Borrar este gasto?'))return;try{await api('gastos?id=eq.'+id,{m:'DELETE'});closeSheet();toast('🗑 Borrado');loadAll()}catch(e){toast('❌ Error')}}
function editPpto(){openSheet(`<h3>⚙️ Presupuesto de ${S.V.mes}</h3><p>Todo lo que puedes gastar en el mes, incluidas cuotas y fijos. Lo que no gastes va a Fintual.</p><input id="e-ppto" class="amt-in" inputmode="numeric" oninput="fmtIn(this)" value="${'$'+S.ppto.toLocaleString('es-CL')}"><button class="btn p" onclick="savePpto()">Guardar</button>`)}
async function savePpto(){try{await api('presupuestos',{m:'POST',h:{Prefer:'resolution=merge-duplicates'},b:{periodo:S.periodo,monto:val('e-ppto')}});closeSheet();toast('✅ Presupuesto actualizado');loadAll()}catch(e){toast('❌ Error')}}
async function loadIngresos(){try{const all=await api('ingresos?order=fecha.asc');const b={};all.forEach(i=>{const k=i.fecha.slice(0,7);b[k]=(b[k]||0)+i.monto});S.ing=b;
  const y=String(new Date().getFullYear()),rows=all.filter(i=>i.fecha.startsWith(y)&&i.base_tributable);
  if(rows.length){const meses=new Set(rows.map(r=>r.fecha.slice(0,7))).size,last=rows[rows.length-1].base_tributable,rest=Math.max(0,12-meses);
    const baseAnual=rows.reduce((s,r)=>s+r.base_tributable,0)+last*rest,pagado=rows.reduce((s,r)=>s+(r.impuesto||0),0)+impMes(last)*rest,debido=impAnual(baseAnual);
    S.tax={y,pagado,debido,dev:Math.max(0,pagado-debido),baseAnual,marg:TR.find(([l])=>last/UTM<=l)[1],abril:rows.find(r=>r.fecha.slice(5,7)==='04')};}
  if(S.V.mes){renderNext();renderMeta();}}catch(e){console.error(e)}}

loadAll();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('sheet-bg').classList.contains('on'))loadAll()});
</script>
