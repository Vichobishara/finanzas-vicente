<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEEEF3">
<title>Bienvenida · prototipo</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>/* Mismo CSS que index.html: la bienvenida usa las piezas de la app */
:root{--bg:#EEEEF3;--bg2:#FFFFFF;--bg3:#F4F4F7;--card:#FFFFFF;--border:#EDEDF2;--text:#121217;--sec:#6E6E7A;--hint:#A3A3AE;--ac:#121217;--ac-d:#121217;--ac-t:#F1F1F4;--navy:#121217;--green:#12B76A;--green-d:#067647;--red:#F04438;--red-d:#B42318;--amber:#F79009;--amber-d:#B54708;--sh:0 1px 2px rgba(18,18,23,.03),0 10px 30px -12px rgba(18,18,23,.08);--safe-t:env(safe-area-inset-top,20px);--safe-b:env(safe-area-inset-bottom,16px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,textarea{-webkit-user-select:text;user-select:text;touch-action:manipulation;font-family:inherit}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;letter-spacing:0}
button{font-family:inherit;cursor:pointer;color:inherit;transition:transform .15s,background .2s,box-shadow .2s}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{max-width:440px;margin:0 auto;padding:calc(var(--safe-t) + 12px) 18px calc(28px + var(--safe-b))}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.who{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(150deg,#8B7CF6,#6246EA);color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:var(--sh)}
.hdr small{font-size:13px;color:var(--sec);display:block;margin-bottom:1px}
.hdr h1{font-size:24px;font-weight:800;letter-spacing:-.6px}
.refresh{width:44px;height:44px;border-radius:50%;background:var(--card);border:none;display:flex;align-items:center;justify-content:center;color:var(--text);box-shadow:var(--sh)}
.refresh:active{transform:rotate(-90deg) scale(.94)}
#hero-w{padding-top:12px}
.hero{border-radius:30px;padding:22px 22px 20px;position:relative;overflow:hidden;color:#fff;background:linear-gradient(160deg,#2A2A33,var(--navy));--peek:#C9C9D3;box-shadow:0 -12px 0 -7px var(--peek),0 16px 32px -16px rgba(18,18,23,.5);transition:background .4s,box-shadow .4s}
.hero.ok{background:linear-gradient(160deg,#2BCB85,#0B9A5C);--peek:#A7E9C8;box-shadow:0 -12px 0 -7px var(--peek),0 16px 32px -14px rgba(11,154,92,.5)}
.hero.warn{background:linear-gradient(160deg,#FBA93A,#E07008);--peek:#FDD9A4;box-shadow:0 -12px 0 -7px var(--peek),0 16px 32px -14px rgba(224,112,8,.45)}
.hero.bad{background:linear-gradient(160deg,#F66A5E,#D1352A);--peek:#FBC4BE;box-shadow:0 -12px 0 -7px var(--peek),0 16px 32px -14px rgba(209,53,42,.45)}
.hero:after{content:'';position:absolute;border-radius:50%;pointer-events:none;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 70%);top:-110px;right:-70px}
.h-lbl{font-size:14px;font-weight:600;color:rgba(255,255,255,.82);position:relative}
.h-amt{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1.05;margin:6px 0 10px;font-variant-numeric:tabular-nums;position:relative}
.h-l1{font-size:15px;font-weight:600;position:relative}
.h-l2{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:3px;position:relative}
.h-sum{position:relative;font-size:13.5px;margin-top:4px}
.h-sum div{display:flex;justify-content:space-between;padding:3px 0;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums}
.h-sum div.t{border-top:1px solid rgba(255,255,255,.25);margin-top:4px;padding-top:7px;color:#fff;font-weight:700;font-size:15px}
.h-bar{height:6px;background:rgba(255,255,255,.2);border-radius:99px;margin:18px 0 16px;overflow:hidden;position:relative}
.h-bar div{height:100%;background:#fff;border-radius:99px;width:0;transition:width .6s}
.h-msg svg.i{width:18px;height:18px;margin-top:1px}
.h-msg{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.16);border:none;border-radius:18px;padding:11px 13px;font-size:13px;line-height:1.45;position:relative;z-index:1;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.act{border:none;border-radius:99px;padding:8px 14px 8px 8px;font-size:15px;white-space:nowrap;font-weight:600;display:flex;align-items:center;gap:10px;text-align:left;letter-spacing:-.2px}
.act i{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act.p{background:var(--ac);color:#fff;box-shadow:0 12px 24px -10px rgba(18,18,23,.55)}
.act.p i{background:#fff;color:var(--ac)}
.act.s{background:var(--card);box-shadow:var(--sh)}
.act.s i{background:var(--ac-t);color:var(--ac)}
.act:active{transform:scale(.97)}
.win{margin:-4px 0 14px;padding:10px 14px;border-radius:99px;text-align:center;font-size:13px;color:var(--green-d);font-weight:600;background:#ECFDF3}
.nudge{margin-bottom:10px;padding:12px 12px 12px 16px;border-radius:22px;background:var(--card);box-shadow:var(--sh);font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.nudge button{border:none;background:var(--navy);color:#fff;font-weight:600;font-size:13px;padding:9px 14px;border-radius:99px;white-space:nowrap}
.card{background:var(--card);border-radius:26px;padding:6px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:12px 0 4px}
.card-h h2{font-size:16px;font-weight:800;letter-spacing:-.3px}
.card-h button{border:none;background:var(--ac-t);color:var(--ac);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px}
.crow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left}
.crow:last-child{border-bottom:none}
.crow:active{opacity:.6}
.ic{width:44px;height:44px;border-radius:50%;background:var(--bg3);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.cm{flex:1;min-width:0}
.cm b{font-size:14.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm small{font-size:12.5px;color:var(--sec)}
.ca{text-align:right;font-size:15px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:6px;background:#EDEDF2;border-radius:99px;margin-top:8px;overflow:hidden}
.bar div{height:100%;border-radius:99px}
.fin{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px;border-radius:26px;margin-bottom:14px;background:var(--card);border:none;box-shadow:var(--sh);width:100%;text-align:left;position:relative;overflow:hidden}
.fin span{font-size:12.5px;color:var(--sec)}
.fin span b{display:block;color:var(--text);font-size:14.5px;font-weight:600;margin-bottom:2px}
.fin > b{font-size:22px;font-weight:800;color:var(--green-d);white-space:nowrap;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.fin:active,.next:active,.meta:active{transform:scale(.98)}
.chev{flex-shrink:0;width:8px;height:8px;border-top:2px solid var(--hint);border-right:2px solid var(--hint);transform:rotate(45deg);font-size:0;margin-right:4px}
.next{display:flex;gap:12px;align-items:center;padding:16px 18px;border-radius:26px;margin-bottom:14px;background:var(--card);border:none;box-shadow:var(--sh);width:100%;text-align:left}
.next i{font-style:normal;font-size:20px;width:44px;height:44px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.next b{font-size:14.5px;font-weight:600;display:block}
.next small{font-size:12.5px;color:var(--sec)}
.next .cm b{white-space:normal}
.big-g{font-size:34px;font-weight:800;letter-spacing:-1px;color:var(--green-d);margin:2px 0 4px;font-variant-numeric:tabular-nums}
.step{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.step:last-child{border-bottom:none}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--ac-t);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.step .n.ok{background:var(--green);color:#fff}
.step b{font-size:14px;font-weight:600;display:block;margin-bottom:3px}
.step small{font-size:12.5px;color:var(--sec);line-height:1.5;display:block}
.fine{font-size:11px!important;color:var(--hint)!important;line-height:1.5}
.meta{padding:20px;border-radius:26px;margin-bottom:14px;background:linear-gradient(160deg,#2A2A33,var(--navy));color:#fff;border:none;width:100%;text-align:left;box-shadow:0 14px 30px -14px rgba(18,18,23,.6);position:relative;overflow:hidden}
.meta:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;border:30px solid rgba(255,255,255,.05);top:-80px;right:-60px;pointer-events:none}
.meta .t{font-size:12px;font-weight:600;color:#FEC84B;letter-spacing:.02em}
.meta .v{font-size:26px;font-weight:800;margin:6px 0 4px;letter-spacing:-.5px}
.meta .v span{color:rgba(255,255,255,.55)!important}
.meta small{font-size:12.5px;color:rgba(255,255,255,.7);line-height:1.5}
.meta small b{color:#fff!important}
.meta .bar{background:rgba(255,255,255,.12);margin-top:12px}
.meta .bar div{background:linear-gradient(90deg,#FDB022,#FEC84B)}
.mt{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;font-size:12.5px;padding:10px 0;border-bottom:1px solid var(--border);align-items:center}
.mt:last-child{border-bottom:none}
.mt b{font-size:13px}
.mt.h{color:var(--hint);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.lever{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.5;color:var(--sec)}
.lever:last-child{border-bottom:none}
.lever b{color:var(--text);font-weight:600}
.cal{display:block;text-align:center;text-decoration:none;padding:16px;border-radius:99px;font-size:16px;font-weight:600;margin-top:14px;background:var(--ac);color:#fff;box-shadow:0 10px 24px -8px rgba(18,18,23,.5)}
.sheet-bg{position:fixed;inset:0;background:rgba(18,18,23,.4);z-index:100;display:none;align-items:flex-end;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:440px;margin:0 auto;background:var(--bg2);border-radius:32px 32px 0 0;padding:10px 20px calc(20px + var(--safe-b));max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:up .28s cubic-bezier(.2,.9,.3,1);position:relative}
body.lock{overflow:hidden}
.x{position:sticky;top:0;float:right;margin:-2px -6px 0 8px;width:34px;height:34px;border-radius:50%;border:none;background:var(--bg3);color:var(--sec);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}
.x:active{transform:scale(.9)}
.sheet.busy{pointer-events:none}
.sheet.busy .btn{opacity:.55}
.refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.bk{position:sticky;top:0;float:left;margin:-2px 8px 0 -6px;width:34px;height:34px;border-radius:50%;border:none;background:var(--bg3);color:var(--sec);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}
.handle{width:40px;height:5px;background:#D6D6DE;border-radius:99px;margin:0 auto 16px;touch-action:none}
.sheet h3{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.sheet p{font-size:13.5px;color:var(--sec);margin-bottom:14px;line-height:1.5}
.sheet label{font-size:13px;color:var(--text);font-weight:600;display:block;margin:16px 0 8px}
.sheet input,.sheet select{width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid transparent;background:var(--bg3);color:var(--text);font-size:16px;-webkit-appearance:none;outline:none;transition:border-color .2s,background .2s}
.sheet input:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 4px rgba(18,18,23,.08)}
.amt-in{font-size:42px!important;font-weight:800;text-align:center;letter-spacing:-1px;padding:18px 14px!important;background:transparent!important;border:none!important;border-bottom:2px solid var(--border)!important;border-radius:0!important;box-shadow:none!important;font-variant-numeric:tabular-nums}
.amt-in::placeholder{color:#D6D6DE}
.amt-in:focus{border-bottom-color:var(--ac)!important}
.sheet .card,.sheet .box{background:var(--bg3);box-shadow:none;border:none}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sugs button,.chip{padding:9px 15px;border-radius:99px;border:1.5px solid var(--border);background:#fff;font-size:13.5px;font-weight:500}
.sugs button:active,.chip:active{transform:scale(.95)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.btn{width:100%;padding:16px;border-radius:99px;border:none;font-size:16px;font-weight:600;margin-top:16px}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--ac);color:#fff;box-shadow:0 10px 24px -8px rgba(18,18,23,.5)}
.btn.p[style*="bg3"]{box-shadow:none}
.btn.g{background:var(--green);color:#fff;margin-top:8px;box-shadow:0 10px 24px -10px rgba(18,183,106,.6)}
.btn.d{background:#FEF3F2;color:var(--red-d);margin-top:8px}
.verdict{margin-top:16px;padding:14px 16px;border-radius:18px;font-size:14px;line-height:1.5;display:none;border:1px solid transparent}
.verdict.on{display:block}
.verdict .vt{font-size:16px;font-weight:700;display:block;margin-bottom:4px}
.verdict b{font-weight:700}
.verdict.ok{background:#ECFDF3;border-color:#ABEFC6}
.verdict.ok .vt{color:var(--green-d)}
.verdict.warn{background:#FFFAEB;border-color:#FEDF89}
.verdict.warn .vt{color:var(--amber-d)}
.verdict.bad{background:#FEF3F2;border-color:#FECDCA}
.verdict.bad .vt{color:var(--red-d)}
.ia{padding:16px 16px 14px;margin-bottom:16px}
.ia h4{font-size:16px;font-weight:700;margin-bottom:2px}
.ia p{font-size:13px;color:var(--sec)}
.ia .chips{margin:10px 0 2px}
.ia .chip{font-size:12.5px;padding:7px 11px}
.ia-in{display:flex;gap:8px;margin-top:10px}
.ia-in input{flex:1;min-width:0;padding:13px 16px;border-radius:99px;border:1.5px solid transparent;background:var(--bg3);color:var(--text);font-size:16px;-webkit-appearance:none;outline:none}
.ia-in input:focus{border-color:var(--ac);background:#fff}
.ia-in button{margin:0;width:auto;padding:0 18px;font-size:15px}
.ia-in button:disabled{opacity:.5}
.ia-log{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.ia-q,.ia-a{padding:11px 15px;border-radius:20px;font-size:14px;line-height:1.5;max-width:92%}
.ia-q{align-self:flex-end;background:var(--navy);color:#fff}
.ia-a{align-self:flex-start;background:var(--bg3)}
.verdict.neg{background:#F4F3FF;border-color:#D9D6FE}
.verdict.neg .vt{color:#5925DC}
.box{background:var(--card);border-radius:20px;padding:4px 16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:13.5px;gap:10px}
.row:last-child{border-bottom:none}
.row span{color:var(--sec)}
.row b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding:16px 2px 8px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.chart span{width:100%;max-width:18px;border-radius:6px 6px 3px 3px;background:#E2E2E9;min-height:3px}
.chart span.b{background:var(--green)}
.chart small{font-size:10px;color:var(--hint);font-weight:500}
.tip{display:flex;gap:12px;background:var(--card);border:none;border-radius:20px;box-shadow:var(--sh);padding:13px 14px;font-size:13.5px;line-height:1.5;color:var(--sec);margin-bottom:8px}
.tip i{font-style:normal;font-size:18px}
.tip b{color:var(--text);font-weight:600}
.tip .cm2{flex:1;min-width:0}
.tip .go{display:inline-block;margin-top:8px;border:none;background:var(--navy);color:#fff;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:99px}
.sec-t{font-size:16px;font-weight:700;letter-spacing:-.3px;margin:18px 4px 10px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--bg3);color:var(--sec);white-space:nowrap}
.pill.ok{background:#ECFDF3;color:var(--green-d)}.pill.warn{background:#FFFAEB;color:var(--amber-d)}.pill.bad{background:#FEF3F2;color:var(--red-d)}
.sum{padding:16px 18px}
.sum .k{font-size:13px;color:var(--sec);font-weight:500}
.sum .v{font-size:30px;font-weight:700;letter-spacing:-1px;margin:2px 0 2px;font-variant-numeric:tabular-nums}
.sum .v span{font-size:15px;color:var(--hint);font-weight:600;letter-spacing:-.2px}
.pace{position:relative;height:10px;background:var(--bg3);border-radius:99px;margin:12px 0 6px;overflow:visible}
.pace>div{height:100%;border-radius:99px}
.pace>i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);border-radius:2px}
.pace-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--hint)}
.cmp{margin-top:12px;padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.45;background:var(--bg3);color:var(--sec)}
.cmp b{color:var(--text)}
.hab{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.hab:last-child{border-bottom:none}
.hab .ck{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;background:var(--bg3);color:var(--hint);border:1.5px dashed #D0D5DD}
.hab .ck.ok{background:var(--green);color:#fff;border:none}
.hab .ck.wait{border-style:solid}
.hab b{font-size:14px;font-weight:600;display:block}
.hab small{font-size:12.5px;color:var(--sec);line-height:1.4;display:block}
.hab button{border:none;background:var(--navy);color:#fff;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.score{display:flex;align-items:center;gap:14px;padding:14px 0 8px}
.ring{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.ring:after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--card)}
.ring span{position:relative;z-index:1;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.score b{font-size:17px;font-weight:700;display:block;letter-spacing:-.3px}
.score small{font-size:13px;color:var(--sec);line-height:1.4}
.seg{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px;margin-top:12px}
.seg div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11.5px;color:rgba(255,255,255,.72)}
.legend span:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}
.money{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.money:last-of-type{border-bottom:none}
.money .ic{width:38px;height:38px;border-radius:12px;font-size:17px}

.avatar.vacio{background:var(--bg3);color:var(--hint)}
.hero .h-amt{font-weight:700;letter-spacing:-1.6px}
.hdr h1{font-weight:700}
/* Pantallas chicas (iPhone SE): los dos botones de Hoy caben */
@media (max-width:380px){.actions{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.act{font-size:14px;gap:7px;padding:6px 10px 6px 6px;min-width:0}.act i{width:34px;height:34px}}
/* Pantalla de fondo: un poco más liviana */
.hab b{font-weight:600}
.card-h h2{font-weight:700}
</style>
</head>
<body>
<div class="app">
  <div class="hdr"><div class="who"><div class="avatar" id="av">?</div><div><small id="saludo">Bienvenido</small><h1 id="titulo">Tu plata</h1></div></div></div>
  <div id="hero-w"></div>
  <div class="actions" id="acciones" style="display:none"><button class="act p" onclick="toast('Aquí anotas tus gastos')"><i><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i>Anotar gasto</button><button class="act s" onclick="toast('Aquí preguntas antes de comprar')"><i><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg></i>¿Me alcanza?</button></div>
  <div class="card" id="config" style="margin-top:16px"></div>
  <p class="fine" style="text-align:center;margin-top:14px">Prototipo de la bienvenida para amigos · no guarda nada</p>
</div>
<div class="sheet-bg" id="sheet-bg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
// Bienvenida con el mismo UX de la app: tu pantalla de Hoy se arma en vivo y cada pregunta sube como hoja.
const $=id=>document.getElementById(id);
const fmt=n=>'$'+Math.round(n).toLocaleString('es-CL');
let tT;const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2400)};
const BANCOS=[{id:'chile',n:'Banco de Chile',c:'#0033A0',apple:1,correo:1},{id:'santander',n:'Santander',c:'#EC0000',apple:1,correo:1},{id:'bci',n:'BCI',c:'#00A6E0',apple:1,correo:1},
 {id:'scotia',n:'Scotiabank',c:'#D81E05',apple:1,correo:0},{id:'falabella',n:'Falabella / CMR',c:'#3E9B35',apple:1,correo:1},{id:'estado',n:'BancoEstado',c:'#F58220',apple:1,correo:0},
 {id:'itau',n:'Itaú',c:'#EC7000',apple:1,correo:1},{id:'mach',n:'MACH o Tenpo',c:'#6B2BD9',apple:1,correo:0}];
const B=id=>BANCOS.find(b=>b.id===id);
const S={nombre:'',sueldo:0,dia:null,tel:null,bancos:[],hechos:{},i:0,listo:false};
const DIAS={fin:'A fin de mes',ini:'A principio de mes',d15:'El 15',otro:'Otro día'};

// ---------- Hojas (mismo comportamiento que la app) ----------
let cierreT;
function abre(h){clearTimeout(cierreT);const bg=$('sheet-bg');bg.classList.remove('closing');$('sheet').innerHTML='<div class="handle"></div><button class="x" onclick="cierra()" aria-label="Cerrar">×</button>'+h;bg.classList.add('on');document.body.classList.add('lock');$('sheet').scrollTop=0}
function cierra(){const bg=$('sheet-bg');if(!bg.classList.contains('on'))return;bg.classList.add('closing');bg.classList.remove('on');document.body.classList.remove('lock');cierreT=setTimeout(()=>bg.classList.remove('closing'),230);pinta()}
$('sheet-bg').addEventListener('click',e=>{if(e.target.id==='sheet-bg')cierra()});
// Siguiente pregunta: cierra la hoja, deja ver cómo cambió tu pantalla y sube la próxima
function sigue(){cierra();setTimeout(()=>{const p=pendiente();p?p.abrir():fin()},650)}

// ---------- Tu pantalla de Hoy, en vivo ----------
const plan=()=>{const g=Math.round(S.sueldo*.8/10000)*10000;return{gasto:g,ahorro:S.sueldo-g,dia:Math.round(g/30/100)*100}};
function pinta(){
  $('av').innerHTML=S.nombre?S.nombre[0].toUpperCase():'<svg class="li" viewBox="0 0 24 24" style="width:22px;height:22px"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';$('av').classList.toggle('vacio',!S.nombre);
  $('saludo').textContent=S.nombre?`Hola, ${S.nombre}`:'Bienvenido';
  const P=plan(),con=S.bancos.filter(b=>S.hechos[b]).length;
  $('hero-w').innerHTML=S.sueldo?`<div class="hero ${S.listo?'ok':''}"><div class="h-lbl">Hoy puedes gastar</div><div class="h-amt">${fmt(P.dia)}</div>
    <div class="h-sum"><div><span>Plata del mes</span><span>${fmt(P.gasto)}</span></div><div><span>Para ahorrar</span><span>${fmt(P.ahorro)}</span></div>
    <div class="t"><span>${S.dia?`Te dura: ${DIAS[S.dia].toLowerCase()}`:'¿Hasta cuándo?'}</span><span>${S.dia?'✓':'…'}</span></div></div>
    ${S.listo?`<div class="h-msg" style="margin-top:14px"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><span>Listo. Mira este número cada día y no te pasas.</span></div>`:''}</div>`
   :`<div class="hero"><div class="h-lbl">Hoy puedes gastar</div><div class="h-amt">$ —</div><div class="h-l2">Responde 4 preguntas y aparece tu número.</div></div>`;
  $('acciones').style.display=S.listo?'grid':'none';
  const T=tareas(),n=T.filter(t=>t.ok).length;
  $('config').innerHTML=S.listo?`<div class="card-h"><h2>Todo listo</h2></div><div class="hab"><div class="ck ok">✓</div><div class="cm"><b>${con?`${con} tarjeta${con>1?'s':''} conectada${con>1?'s':''}`:'Anotas con el +'}</b><small>${con?'Tus compras se anotan solas':'Tres segundos por gasto'}</small></div></div>`
   :`<div class="card-h"><h2>Arma tu app</h2><span class="pill">${n} de ${T.length}</span></div>${T.map(t=>`<div class="hab"><div class="ck ${t.ok?'ok':''}">${t.ok?'✓':''}</div><div class="cm"><b>${t.t}</b><small>${t.s}</small></div>${t.ok?'':`<button onclick="${t.a}">${t===pendiente()?'Seguir':'Hacer'}</button>`}</div>`).join('')}
   ${pendiente()?`<button class="w-btn" style="margin:10px 0 14px" onclick="pendiente().abrir()">${n?'Seguir':'Empezar'}</button>`:''}`}
function tareas(){const con=S.bancos.filter(b=>S.hechos[b]).length;return[
  {t:'Tu nombre',s:S.nombre||'Para saludarte',ok:!!S.nombre,a:'hNombre()',abrir:hNombre},
  {t:'Cuánto te llega',s:S.sueldo?fmt(S.sueldo)+' al mes':'Así calculo tu número',ok:!!S.sueldo,a:'hSueldo()',abrir:hSueldo},
  {t:'Cuándo te pagan',s:S.dia?DIAS[S.dia]:'Hasta cuándo te tiene que durar',ok:!!S.dia,a:'hDia()',abrir:hDia},
  {t:'Tus tarjetas',s:S.bancos.length?`${con} de ${S.bancos.length} conectadas`:'Para que tus compras se anoten solas',ok:S.bancos.length>0&&S.i>=S.bancos.length,a:'hTel()',abrir:()=>S.tel?(S.bancos.length?hConectar():hBancos()):hTel()}]}
const pendiente=()=>tareas().find(t=>!t.ok);

// ---------- Íconos de línea (nítidos en cualquier pantalla, en vez de emojis) ----------
const I=d=>`<svg class="li" viewBox="0 0 24 24">${d}</svg>`;
const IC={phone:I('<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>'),mail:I('<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 6.5 8.5 6 8.5-6"/>'),
  doc:I('<path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 3v5h5M9 13h6M9 16.5h4"/>'),pen:I('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
  apple:'<svg class="li f" viewBox="0 0 24 24"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.2.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.2.9-1.3 1.3-2.5 1.3-2.6-.1 0-2.5-.9-2.5-3.8zM14.1 5.8c.6-.8 1.1-1.8 1-2.8-.9 0-2 .6-2.7 1.4-.6.7-1.1 1.7-1 2.7 1 .1 2-.5 2.7-1.3z"/></svg>',
  android:'<svg class="li f" viewBox="0 0 24 24"><path d="M6 18c0 .6.4 1 1 1h1v3a1.3 1.3 0 0 0 2.6 0v-3h2.8v3a1.3 1.3 0 0 0 2.6 0v-3h1c.6 0 1-.4 1-1V8.5H6zM3.8 8.5a1.3 1.3 0 0 0-1.3 1.3v6a1.3 1.3 0 0 0 2.6 0v-6c0-.7-.6-1.3-1.3-1.3zm16.4 0a1.3 1.3 0 0 0-1.3 1.3v6a1.3 1.3 0 0 0 2.6 0v-6c0-.7-.6-1.3-1.3-1.3zM15.5 3l1.2-1.2a.4.4 0 0 0-.6-.6L14.8 2.5A5.6 5.6 0 0 0 12 1.8c-1 0-2 .3-2.8.7L7.9 1.2a.4.4 0 0 0-.6.6L8.5 3A5.3 5.3 0 0 0 6 7.5h12A5.3 5.3 0 0 0 15.5 3zM10 5.5H9v-1h1zm5 0h-1v-1h1z"/></svg>'};
// Título de cada hoja, con "Paso N de 4" arriba para saber cuánto falta
const H=(t,s)=>{const i=tareas().findIndex(x=>!x.ok);return`${i<0?'':`<div class="w-paso">Paso ${i+1} de 4</div>`}<h3 class="w-h">${t}</h3>${s?`<p class="w-p">${s}</p>`:''}`};
const pie=(...b)=>`<div class="pie">${b.join('')}</div>`;
const bt=(t,on,cls='')=>`<button class="w-btn ${cls}" onclick="${on}">${t}</button>`;

// ---------- Preguntas ----------
function hNombre(){abre(H('¿Cómo te llamo?','Tu nombre o apodo. Así te saludo cada día.')+
  `<input id="nom" class="w-in" placeholder="Tu nombre" value="${S.nombre}" autocomplete="given-name" enterkeyhint="done" onkeydown="if(event.key==='Enter')gNombre()">`+pie(bt('Continuar','gNombre()')));setTimeout(()=>$('nom').focus(),250)}
function gNombre(){const v=$('nom').value.trim();if(!v)return $('nom').focus();S.nombre=v.split(' ')[0];sigue()}
function hSueldo(){abre(H('¿Cuánto te llega al mes?','Más o menos. Solo tú lo ves.')+
  `<input id="sue" class="w-amt" inputmode="numeric" placeholder="$0" value="${S.sueldo?fmt(S.sueldo):''}" oninput="const v=this.value.replace(/\\D/g,'');this.value=v?'$'+Number(v).toLocaleString('es-CL'):''">
  <div class="w-sugs">${[500000,800000,1200000,2000000].map(v=>`<button onclick="this.classList.add('on');$('sue').value='${fmt(v)}';setTimeout(gSueldo,180)">${v>=1e6?('$'+(v/1e6).toString().replace('.',',')+' M'):('$'+v/1000+' mil')}</button>`).join('')}</div>`+pie(bt('Continuar','gSueldo()')))}
function gSueldo(){const v=parseInt($('sue').value.replace(/\D/g,''))||0;if(v<100000){toast('Pon cuánto te llega al mes');return}S.sueldo=v;sigue()}
function hDia(){abre(H('¿Cuándo te pagan?','Así sé hasta cuándo te tiene que durar la plata.')+
  `<div class="w-list">${Object.entries(DIAS).map(([k,t])=>`<button class="w-row ${S.dia===k?'on':''}" onclick="S.dia='${k}';this.classList.add('on');setTimeout(sigue,260)"><span class="w-t">${t}</span><span class="w-radio"></span></button>`).join('')}</div>`)}
function hTel(){abre(H('¿Qué celular tienes?','Para mostrarte lo que funciona en el tuyo.')+
  `<div class="w-duo"><button onclick="S.tel='iphone';hBancos()">${IC.apple}<span>iPhone</span></button><button onclick="S.tel='android';hBancos()">${IC.android}<span>Android</span></button></div>`)}
function hBancos(){abre(H('¿Qué tarjetas usas?','Marca todas las que tengas.')+
  `<div class="w-list">${BANCOS.map(b=>{const on=S.bancos.includes(b.id);return`<button class="w-row ${on?'on':''}" onclick="tBanco('${b.id}')"><span class="w-logo" style="background:${b.c}">${b.n[0]}</span><span class="w-t">${b.n}</span><span class="w-check"></span></button>`}).join('')}</div>`+
  pie(`<button class="w-btn" ${S.bancos.length?'':'disabled'} onclick="S.i=0;hConectar()">${S.bancos.length?`Continuar con ${S.bancos.length}`:'Marca al menos una'}</button>`,bt('Solo uso efectivo',"S.bancos=[];S.i=0;sigue()",'sec')))}
function tBanco(id){const i=S.bancos.indexOf(id);i<0?S.bancos.push(id):S.bancos.splice(i,1);const y=$('sheet').scrollTop;hBancos();$('sheet').scrollTop=y}
const FORMAS={apple:[IC.phone,'Con tu iPhone','Pagas con Apple Pay y se anota sola','2 min'],correo:[IC.mail,'Correos del banco','Cada compra que te avisan se anota sola','2 min'],cartola:[IC.doc,'Foto de la cartola','Una vez al mes','30 s'],mano:[IC.pen,'La anoto yo','Tocas + y pones el monto','']};
function hConectar(){const b=B(S.bancos[S.i]),F=[...(b.apple&&S.tel==='iphone'?['apple']:[]),...(b.correo?['correo']:[]),'cartola','mano'],r=FORMAS[F[0]];
  abre(`<div class="w-bank"><span class="w-logo" style="background:${b.c}">${b.n[0]}</span><span>${b.n}${S.bancos.length>1?` · ${S.i+1} de ${S.bancos.length}`:''}</span></div>`+
  H('¿Cómo anotamos tus compras?','')+
  `<button class="w-reco" onclick="hGuia('${F[0]}')"><span class="w-tag">Recomendado</span><span class="w-reco-in"><span class="w-ic">${r[0]}</span><span class="w-t">${r[1]}<small>${r[2]} · ${r[3]}</small></span></span><span class="w-go">Conectar</span></button>
  <div class="w-lbl">Otras formas</div>
  <div class="w-list">${F.slice(1).map(k=>`<button class="w-row" onclick="hGuia('${k}')"><span class="w-ic">${FORMAS[k][0]}</span><span class="w-t">${FORMAS[k][1]}<small>${FORMAS[k][2]}</small></span><span class="w-chev"></span></button>`).join('')}</div>`+
  pie(bt('Ahora no','sigBanco()','sec')))}
function hGuia(k){const b=B(S.bancos[S.i]);
  const G={apple:['Conecta tu iPhone','Te muestro dónde tocar, paso a paso.',['Instala el atajo','Crea la automatización','Paga algo chico para probar'],'Empezar'],
    correo:['Reenvía los correos',`Los avisos de ${b.n} llegan a tu dirección personal.`,['Toca Abrir Gmail','Pega tu dirección en "Reenviar a"','Listo, yo confirmo el resto'],'Abrir Gmail'],
    cartola:['Foto de tu cartola','La que te llega por correo o está en la app del banco.',['Saca la foto o elige el PDF','Revisa lo que encontré','Guarda'],'Sacar foto'],
    mano:['Perfecto','El botón + está siempre abajo al medio. Pones el monto y yo pongo la categoría.',[],'Entendido']}[k];
  abre(H(G[0],G[1])+(G[2].length?`<div class="w-steps">${G[2].map((t,j)=>`<div><span>${j+1}</span>${t}</div>`).join('')}</div>`:'')+
  pie(bt(G[3],`S.hechos['${b.id}']='${k}';toast('${k==='mano'?'Anotado':b.n+' conectada'}');sigBanco()`)))}
function sigBanco(){S.i++;S.i<S.bancos.length?hConectar():sigue()}
function fin(){const P=plan();abre(H('Tu plan del mes','Para que te sobre plata todos los meses.')+
  `<div class="w-plan"><div><small>Para gastar</small><b>${fmt(P.gasto)}</b></div><div><small>Para ahorrar</small><b class="v">${fmt(P.ahorro)}</b></div></div>`+
  pie(bt('Me parece',`S.listo=true;cierra();setTimeout(()=>toast('Listo, ${S.nombre||'bienvenido'}'),300)`)))}
// ---------- Paso 0: ponerla en la pantalla de inicio (no está en la App Store). Va primero: en iPhone, lo que
// respondes en Safari no pasa a la app del inicio, así que conviene instalarla antes de empezar ----------
const UA=navigator.userAgent,esIOS=/iP(hone|ad|od)/.test(UA),enApp=/Instagram|FBAN|FBAV|WhatsApp|Line\/|TikTok|GSA\//.test(UA),
  instalada=navigator.standalone||!!(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
const K=(d,t)=>`<span class="w-k">${d?`<svg viewBox="0 0 24 24">${d}</svg>`:''}${t}</span>`,
  KI={share:'<path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/>',mas:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/>',
    dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',vdots:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>'};
function hInicio(){const P=enApp?[`Toca ${K(KI.dots,'')} y elige "Abrir en ${esIOS?'Safari':'Chrome'}"`,'Ahí sigues con estos pasos']
   :esIOS?[`Toca ${K(KI.share,'Compartir')} abajo`,`Toca ${K(KI.mas,'Agregar a inicio')}`,`Toca ${K('','Agregar')}`,'Ábrela desde el ícono nuevo']
   :[`Toca ${K(KI.vdots,'')} arriba`,`Toca ${K(KI.mas,'Agregar a pantalla principal')}`,'Ábrela desde el ícono nuevo'];
  abre(`<h3 class="w-h">Primero, ponla en tu inicio</h3><p class="w-p">No está en la ${esIOS?'App Store':'Play Store'}: se agrega desde el navegador, gratis. Así la abres con un toque, como cualquier app.</p>
  <div class="w-steps w-ini">${P.map((t,j)=>`<div><span>${j+1}</span><p>${t}</p></div>`).join('')}</div>`+
  pie(bt('Ya la agregué',"toast('Ábrela desde tu inicio');cierra();setTimeout(hNombre,650)"),bt('Lo hago después','cierra();setTimeout(hNombre,650)','sec')))}
pinta();setTimeout(instalada?hNombre:hInicio,600);
</script>
</body>
</html>
